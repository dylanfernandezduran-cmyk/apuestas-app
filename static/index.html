<script>
/* splash: trazo ~1.2s, relleno+nombre, espera ~0.8s, sale (~3s). Una vez por sesión (?splash=1 lo fuerza). */
(function(){
  var s=document.getElementById('splash'); if(!s) return;
  var force=/[?&]splash=1/.test(location.search), hold=/[?&]hold=1/.test(location.search);
  var seen=false; try{seen=sessionStorage.getItem('splash_seen')==='1'}catch(e){}
  if(seen&&!force){s.remove();return}
  try{sessionStorage.setItem('splash_seen','1')}catch(e){}
  document.documentElement.classList.add('splashing');
  var reduce=false; try{reduce=matchMedia('(prefers-reduced-motion:reduce)').matches}catch(e){}
  var done=false;
  function end(){ if(done||!s) return; done=true; s.classList.add('out'); document.documentElement.classList.remove('splashing'); setTimeout(function(){ if(s&&s.parentNode)s.remove(); }, reduce?320:820); }
  function fill(){
    s.classList.add('sp-filled','sp-named');
    var svg=s.querySelector('.sp-logo svg'); if(!svg) return;
    svg.querySelectorAll('[data-sp="lace"]').forEach(function(el){ el.style.opacity='1'; });
    svg.querySelectorAll('[data-sp="fill"]').forEach(function(el){
      el.style.strokeDashoffset='0';
      if(el.getAttribute('data-sp-fill')==='1') el.style.fill='#fff';
    });
  }
  function prep(){
    var svg=s.querySelector('.sp-logo svg'); if(!svg) return;
    svg.querySelectorAll('path,ellipse,circle,polyline,polygon,line').forEach(function(el){
      var st=(el.getAttribute('stroke')||'').toLowerCase();
      var fill=(el.getAttribute('fill')||'').toLowerCase();
      var lace = st==='#000000'||st==='#000'||st==='black'||el.closest('g[stroke="#000000"],g[stroke="#000"]');
      if(lace){ el.setAttribute('data-sp','lace'); el.style.opacity='0'; return; }
      var isFilled = fill && fill!=='none' && fill!=='transparent';
      el.setAttribute('data-sp','fill');
      if(isFilled) el.setAttribute('data-sp-fill','1');
      el.style.fill='none';
      el.style.stroke='#fff';
      if(!el.getAttribute('stroke-width')) el.setAttribute('stroke-width','22');
      el.style.strokeLinecap='round'; el.style.strokeLinejoin='round';
      var len=0; try{ len=el.getTotalLength(); }catch(err){ len=1400; }
      if(!(len>0)) len=1400;
      el.style.strokeDasharray=String(len);
      el.style.strokeDashoffset=reduce?'0':String(len);
      if(!reduce) el.style.animation='sp-draw 1.2s ease forwards';
    });
  }
  prep();
  if(reduce) fill();
  else setTimeout(fill, 1200);
  if(!hold){
    s.addEventListener('click',end);
    s.addEventListener('touchend',end,{passive:true});
    document.addEventListener('keydown',end);
    setTimeout(end, reduce?400:2000);
    setTimeout(end, 3200);
  }
})();
</script>

<script>
/* Boot seguro (iOS / PWA / Pages): si hay SW viejo o caché rota, se limpia. En modo estático NUNCA se registra SW. */
(function(){
  var STATIC=!!window.NRNM_STATIC;
  function wipe(){ try{
    if(!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
    if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if(/^shell-v|^api-v/.test(k)) caches.delete(k); }); });
  }catch(e){} }
  if(STATIC){ wipe(); }
  else if('serviceWorker' in navigator && window.isSecureContext){
    addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
  // Escape hatch: ?reset=1 limpia todo y recarga limpio (útil si el PWA quedó en blanco)
  if(/[?&]reset=1/.test(location.search)){
    try{ sessionStorage.clear(); localStorage.removeItem('nrnm_ver_reloaded'); }catch(e){}
    wipe();
    if(location.search.indexOf('reset=1')>=0){
      history.replaceState(null,'',location.pathname+(location.hash||'#/'));
      setTimeout(function(){ location.reload(); }, 200);
    }
  }
  // Si #app sigue en "Cargando…" > 12s, mostrar recuperación
  addEventListener('load', function(){
    setTimeout(function(){
      var a=document.getElementById('app'); if(!a) return;
      var t=(a.textContent||'').trim();
      if(!t || /^Cargando/.test(t) || t==='⏳ Cargando datos reales…'){
        a.innerHTML='<div class="err">⚠️ La app no terminó de cargar.<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn" type="button" id="nrnm-retry">↻ Reintentar</button>'+
          '<a class="btn pri" href="?reset=1">Reparar caché</a></div>'+
          (STATIC?'<div class="sub" style="margin-top:8px">Versión en línea. Si sigue fallando, borra el sitio de la pantalla de inicio y vuelve a abrirlo desde Safari.</div>':'')+
          '</div>';
        var b=document.getElementById('nrnm-retry'); if(b) b.onclick=function(){ location.reload(); };
      }
    }, 12000);
  });
})();
</script>
