# NRNM en GitHub Pages (pt90u): genera JSON estáticos con datos reales y publica el sitio.
# La base SQLite (picks, apertura/cierre, récord) persiste en la rama `estado`.
# No usa llaves: fuentes públicas. Paper trading.
# NOTA: copiar a .github/workflows/pages.yml (el token del bot no tiene scope workflow).
name: NRNM Pages
on:
  schedule:
    # GitHub free throttles */10; staggered hourly slots ≈ every 10 min in practice
    - cron: "0 * * * *"
    - cron: "10 * * * *"
    - cron: "20 * * * *"
    - cron: "30 * * * *"
    - cron: "40 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Settings > Pages > Source = GitHub Actions y variable NRNM_PAGES=1 (manual siempre se puede)
    if: ${{ vars.NRNM_PAGES == '1' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APUESTAS_DB: /tmp/state/history.db
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar base (rama estado)
        run: |
          mkdir -p /tmp/state
          if git fetch --depth=1 origin estado 2>/dev/null; then git show FETCH_HEAD:history.db > /tmp/state/history.db || rm -f /tmp/state/history.db; fi
          ls -la /tmp/state
      - name: Construir sitio estático (datos reales)
        run: timeout 25m python scripts/build_static.py site 48
      - name: Guardar base (rama estado, 1 solo commit)
        if: always()
        run: |
          [ -f /tmp/state/history.db ] || exit 0
          python -c "import sqlite3;c=sqlite3.connect('/tmp/state/history.db');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          mkdir -p /tmp/st && cd /tmp/st && git init -q && cp /tmp/state/history.db . && git add history.db
          git -c user.name="nrnm-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "estado $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:estado
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url }}
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar si el deploy chocó con otro
        if: steps.d1.outcome == 'failure'
        run: sleep 90
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar segundo reintento
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 120
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: final
        name: Confirmar deploy
        run: |
          if [ "${{ steps.d1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.d1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.d2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.d2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.d3.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.d3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "Deploy falló tras reintentos"; exit 1
          fi
          echo "Deploy OK"
