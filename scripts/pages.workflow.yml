# NRNM en GitHub Pages: el runner genera JSON estáticos con datos reales y publica el sitio.
# La base SQLite y la caché HTTP persisten en la rama `estado`.
# Sin llaves de usuario: ESPN, Action Network, Pinnacle guest y Open-Meteo son públicas. Paper trading.
#
# Cadencia: el cron de GitHub es "mejor esfuerzo" y retrasa o descarta ticks (con */10 este
# repo caía cada ~3.5–10 h, mediana ~6 h, no cada 10 min). Usamos minutos impares
# (7,22,37,52) para no coincidir con la congestión de :00, más un cron diario de
# keepalive. Aun así GitHub puede dejar el repo en el "carril lento".
# Si hace falta ~15 min reales, un cron externo (cron-job.org) puede disparar
# repository_dispatch tipo refresh-pages o workflow_dispatch con un PAT; ver
# scripts/trigger_pages_refresh.sh (no se guarda ningún token en el repo).
#
# GitHub desactiva crons a los 60 días sin actividad del repositorio. Cada build
# escribe last-run en `estado`; si no hay cambio de datos, un commit diario de
# keepalive mantiene el repo despierto.
name: NRNM Pages
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Desplegar aunque los datos no hayan cambiado"
        type: boolean
        default: false
  repository_dispatch:
    types: [refresh-pages]
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nrnm-pages
  cancel-in-progress: false
jobs:
  build:
    # apagado hasta activarlo: Settings > Pages > Source = GitHub Actions y variable de repo NRNM_PAGES=1 (manual y dispatch siempre se pueden)
    if: ${{ vars.NRNM_PAGES == '1' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.meta.outputs.changed }}
      hash: ${{ steps.meta.outputs.hash }}
    env:
      APUESTAS_DB: /tmp/state/history.db
      APUESTAS_HTTP_CACHE: /tmp/state/http-cache.json
      TZ: America/Mexico_City
      ODDS_TTL_FLOOR: "600"
      BUDGET_AN: "40"
      BUDGET_PIN: "80"
      BUDGET_OM: "40"
      BUDGET_GEO: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar base y caché (rama estado)
        run: |
          mkdir -p /tmp/state
          if git fetch --depth=1 origin estado 2>/dev/null; then
            git show FETCH_HEAD:history.db > /tmp/state/history.db || rm -f /tmp/state/history.db
            git show FETCH_HEAD:http-cache.json > /tmp/state/http-cache.json || rm -f /tmp/state/http-cache.json
            git show FETCH_HEAD:site-hash.txt > /tmp/state/site-hash.txt || rm -f /tmp/state/site-hash.txt
            git show FETCH_HEAD:last-run.json > /tmp/state/last-run.json || true
          fi
          ls -la /tmp/state
          if [ -f /tmp/state/site-hash.txt ]; then echo "PREV_SITE_HASH=$(cat /tmp/state/site-hash.txt)" >> "$GITHUB_ENV"; fi
      - name: Construir sitio estático (datos reales, incremental si hay caché)
        run: timeout 25m python scripts/build_static.py site 48
      - name: Publicar huella y decidir despliegue
        id: meta
        run: |
          HASH=$(python -c "import json;print(json.load(open('site/data/build.json')).get('hash',''))")
          CHANGED=$(python -c "import json;print('true' if json.load(open('site/data/build.json')).get('changed',True) else 'false')")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "content hash=$HASH changed=$CHANGED"
          mkdir -p /tmp/state
          [ -n "$HASH" ] && printf '%s\n' "$HASH" > /tmp/state/site-hash.txt
          python -c "import json,time; json.dump({'ts':int(time.time()),'iso':time.strftime('%Y-%m-%dT%H:%MZ',time.gmtime()),'hash':open('/tmp/state/site-hash.txt').read().strip(),'event':'''${{ github.event_name }}'''}, open('/tmp/state/last-run.json','w'))"
      - name: Guardar base y caché (rama estado)
        if: always()
        run: |
          [ -d /tmp/state ] || exit 0
          if [ -f /tmp/state/history.db ]; then
            python -c "import sqlite3;c=sqlite3.connect('/tmp/state/history.db');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          fi
          mkdir -p /tmp/st && cd /tmp/st && git init -q
          if git fetch --depth=5 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git estado 2>/dev/null; then
            git checkout -q -B estado FETCH_HEAD || true
          fi
          cp -f /tmp/state/history.db /tmp/state/http-cache.json /tmp/state/site-hash.txt /tmp/state/last-run.json . 2>/dev/null || true
          git add -A
          git config user.name "nrnm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "estado sin cambios de archivo"
          else
            # si sólo cambió last-run.json, commitear como keepalive como máximo 1 vez al día
            ONLY=$(git diff --cached --name-only | tr '\n' ' ')
            if [ "$ONLY" = "last-run.json " ] || [ "$ONLY" = "last-run.json" ]; then
              LAST=$(git log -1 --format=%ct 2>/dev/null || echo 0)
              NOW=$(date +%s)
              if [ $((NOW-LAST)) -lt 72000 ]; then
                echo "keepalive reciente; no se commitea sólo last-run"
                git checkout -- . || true
                exit 0
              fi
            fi
            git commit -qm "estado $(date -u +%FT%TZ)"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:estado
          fi
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.meta.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force == 'true' }}
        with:
          path: site
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && (needs.build.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
